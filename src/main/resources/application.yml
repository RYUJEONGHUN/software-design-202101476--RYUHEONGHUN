spring:
  config:
    import: optional:file:./.env[.properties]
  profiles:
    active: local # 기본값 설정
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  security:
    oauth2:
      client:
        registration:
          google:
            scope:
              - email
              - profile

data:
  encryption:
    key: ${DATA_ENCRYPTION_KEY:${JWT_SECRET_KEY}}

jwt:
  access-token-expiration: 3600000 # 1시간
  refresh-token-expiration: 604800000 # 7일
